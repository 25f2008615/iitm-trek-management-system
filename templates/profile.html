{% extends "layouts/base.html" %}

{% block title %}
My Profile
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="card shadow-sm mx-auto" style="max-width:600px;">

        <div class="card-body">

            <h2 class="mb-4">
                Edit Profile
            </h2>

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">
                        Full Name
                    </label>

                    <input type="text"
                           name="full_name"
                           class="form-control"
                           value="{{ user.full_name }}"
                           required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    <input type="email"
                           class="form-control"
                           value="{{ user.email }}"
                           readonly>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Age
                    </label>

                    <input type="number"
                           name="age"
                           class="form-control"
                           value="{{ user.age }}"
                           required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Gender
                    </label>

                    <select name="gender"
                            class="form-select">

                        <option value="Male"
                        {% if user.gender=="Male" %}
                        selected
                        {% endif %}>
                            Male
                        </option>

                        <option value="Female"
                        {% if user.gender=="Female" %}
                        selected
                        {% endif %}>
                            Female
                        </option>

                        <option value="Other"
                        {% if user.gender=="Other" %}
                        selected
                        {% endif %}>
                            Other
                        </option>

                    </select>

                </div>

                <button class="btn btn-success">

                    Update Profile

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
